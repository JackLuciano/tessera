[package]
name = "tessera"
version = "0.4.0"
description = "Fast, good-looking disk space analyzer"
authors = ["Tessera contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12.0"
sysinfo = "0.39.6"
trash = "5.2.9"
parking_lot = "0.12.5"
tauri-plugin-dialog = "2"
blake3 = "1.8.7"
# Default features pull in `zip` 4.x, which is entirely yanked; NSIS/AppImage updates don't need it
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.4"
notify = "8"
same-file = "1"
lz4_flex = "0.11"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Firefox keeps history and bookmarks in one database, so history is removed row by row
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
