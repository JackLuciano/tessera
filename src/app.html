<!doctype html>
<html lang="en" data-theme="tessera-dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessera</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const m = localStorage.getItem('tessera-mode') || 'system';
        const light = m === 'light' || (m === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'tessera-light' : 'tessera-dark';
        // ?anim=0 is for screenshot captures of the dev preview
        if (localStorage.getItem('tessera-anim') === 'false' || /[?&]anim=0/.test(location.search)) document.documentElement.classList.add('no-anim');
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
